services:
  - type: web
    name: ayogram-coffee-shop
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn coffeeshop.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
